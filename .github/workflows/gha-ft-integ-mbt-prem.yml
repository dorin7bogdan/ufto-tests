name: GitHub-Action-FT-integ-MBT-2
on:
  workflow_dispatch:
    inputs:
      testsToRun:
        description: 'Tests to run (from OpenText SDP/SDM)'
        required: true
        default: '...'
      suiteRunId:
        description: 'Suite Run Id (from OpenText SDP/SDM)'
        required: true
        default: '0'
      executionId:
        description: 'Execution Id (from OpenText SDP/SDM)'
        required: true
        default: '0'
      suiteId:
        description: 'Suite Id (from OpenText SDP/SDM)'
        required: true
        default: '0'    
  push:
    branches:
      - main
permissions:
  actions: read  # Explicitly grant actions:read for this workflow
  contents: read  # Retain read access to contents if needed
env: 
    NODE_TLS_REJECT_UNAUTHORIZED: 0
    ACTIONS_STEP_DEBUG: true  # Enables debug logging
jobs:
  ft_integration_job:
    runs-on: [self-hosted, onprem]
    name: Integration-Job-2
    steps:
      - name: Log workflow inputs for Octane
        run: |
          $inputs = ConvertFrom-Json -InputObject '${{ toJson(github.event.inputs) }}'
          Write-Host "execution_parameter:: $($inputs | ConvertTo-Json -Compress)"

      - name: GitHub Action FT Integration
        uses: MicroFocus/github-action-ft-integration-mbt@main
        id: gha-ft-integration-mbt-2
        with:
          octaneUrl: ${{vars.FULL_DEV}}
          octaneSharedSpace: 1001
          octaneWorkspace: 1003
          octaneClientId: ${{secrets.OCTANE_CLIENT_ID_2}}
          octaneClientSecret: ${{secrets.OCTANE_CLIENT_SECRET_2}}
          githubToken: ${{secrets.GITHUB_TOKEN}}
          minSyncInterval: 0.5
          logLevel: 2          
