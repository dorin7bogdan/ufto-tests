name: Test Artifact Upload
on: [workflow_dispatch]
env:
    NODE_TLS_REJECT_UNAUTHORIZED: 0
    ACTIONS_STEP_DEBUG: true  # Enables debug logging
jobs:
  test-upload:
    runs-on: self-hosted
    steps:
      - name: Debug RUNNER_WORKSPACE and GITHUB_WORKSPACE
        run: |
          echo "RUNNER_WORKSPACE: $env:RUNNER_WORKSPACE"
          echo "GITHUB_WORKSPACE: $env:GITHUB_WORKSPACE"
          echo "Current directory: $(Get-Location)"
        shell: pwsh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: run_results
          path: C:\Plugins\GitHub\runner_ufto-tests\_work\ufto-tests\___mbt\junitResult.xml
