name: FT-integration-ALM
on:
  workflow_dispatch:
    inputs:
      testSets:
        description: 'Test set(s)' # "path\to\folder" or "path\to\GUITest1" or array of paths: ["path\\to\\GUITest1", "path\\to\\GUITest2", ...]. Absolute paths are not allowed. The paths will be validated against the repository root.
        required: true
        default: ""
permissions:
  actions: read  # Explicitly grant actions:read for this workflow
  contents: read  # Retain read access to contents if needed
env: 
    NODE_TLS_REJECT_UNAUTHORIZED: 0
    ACTIONS_STEP_DEBUG: true  # Enables debug logging
jobs:
  ft_integration_alm:
    runs-on: [self-hosted]
    name: Integration-Job-ALM
    steps:
      - name: FT Integration ALM
        uses: dorin7bogdan/functional-testing@main
        id: ft-integration-alm
        with:
          runType: alm
          almTestSets: ${{inputs.testSets}}
          almServerUrl: http://10.168.86.75:8080/qcbin
          almUsername: sa
          almPassword:
          almDomain: AUTOMATION
          almProject: CI_Integration
          ftlUrl: https://raw.githubusercontent.com/dorin7bogdan/tools/main/FTToolsLauncher_26.3.exe
          logLevel: 2
